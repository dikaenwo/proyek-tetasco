# ─── ACL Tetasco Connect ──────────────────────────────────────────────────────
# Format: user <username>  →  topic <topik> <read|write|readwrite>
#
# Topik skema:
#   tetasco/{device_id}/command/#   → Server publish, Lemari subscribe
#   tetasco/{device_id}/status      → Lemari publish, Server subscribe
#   tetasco/{device_id}/sensor      → Lemari publish, Server subscribe
#   tetasco/{device_id}/heartbeat   → Lemari publish, Server subscribe

# ─── Server Pusat ─────────────────────────────────────────────────────────────
user server
topic readwrite tetasco/#

# ─── Lemari (tiap device punya akses terbatas hanya ke topiknya sendiri) ──────
# Lemari-1
user lemari-1
topic write tetasco/lemari-1/status
topic write tetasco/lemari-1/sensor
topic write tetasco/lemari-1/heartbeat
topic read  tetasco/lemari-1/command/#

# Lemari-2
user lemari-2
topic write tetasco/lemari-2/status
topic write tetasco/lemari-2/sensor
topic write tetasco/lemari-2/heartbeat
topic read  tetasco/lemari-2/command/#

