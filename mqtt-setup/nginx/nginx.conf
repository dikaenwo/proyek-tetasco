events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    # Docker internal DNS resolver (refresh tiap 30 detik)
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name _;

        # ── REST API & FastAPI ──────────────────────────────────────────────
        # CORS sudah di-handle oleh FastAPI CORSMiddleware (allow_origins=["*"])
        # Jangan tambah CORS lagi di Nginx → akan duplikat dan ditolak WebView Android
        location /api/ {
            # Gunakan variable agar resolver aktif (dynamic DNS setelah restart)
            set $backend_upstream "http://tetasco-backend:8000";
            proxy_pass         $backend_upstream;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;

            # Preflight OPTIONS: tetap perlu balas dengan CORS agar browser tidak block
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        location /docs {
            set $backend_upstream "http://tetasco-backend:8000";
            proxy_pass $backend_upstream/docs;
        }

        location /openapi.json {
            set $backend_upstream "http://tetasco-backend:8000";
            proxy_pass $backend_upstream/openapi.json;
        }

        # ── MQTT over WebSocket ────────────────────────────────────────────
        # Raspi Lemari connect ke: wss://tetasco.my.id/mqtt (via Cloudflare)
        location /mqtt {
            set $mosquitto_upstream "http://tetasco-mosquitto:9001";
            proxy_pass             $mosquitto_upstream;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_set_header       X-Real-IP  $remote_addr;
            proxy_read_timeout     86400s;
            proxy_send_timeout     86400s;
            proxy_connect_timeout  10s;
        }

        # ── Static Frontend (Dashboard Web) ───────────────────────────────
        location / {
            root      /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
