services:

  # ─── Mosquitto MQTT Broker ──────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: tetasco-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT TCP (internal network / LAN)
      - "9001:9001"   # MQTT WebSocket (diexpose via Cloudflare Tunnel)
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - tetasco-net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -u server -P \"$$MQTT_SERVER_PASS\" -t health -m ping --quiet 2>/dev/null || nc -z localhost 1883 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: tetasco-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://telur:${DB_PASS}@database:5432/tetasco
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: server
      MQTT_PASS: ${MQTT_SERVER_PASS}
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - tetasco-net

  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  database:
    image: postgres:15-alpine
    container_name: tetasco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: telur
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: tetasco
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tetasco-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telur -d tetasco"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tetasco-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - tetasco-net

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:

networks:
  tetasco-net:
    driver: bridge
